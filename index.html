<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Pond</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap');
 
  * { margin: 0; padding: 0; box-sizing: border-box; }
 
  :root {
    --text-dark: #1a1a18;
    --text-muted: #5a5a52;
    --text-light: #8a8a80;
    --bg: #f5f2eb;
    --paper: #faf8f3;
  }
 
  body {
    font-family: 'EB Garamond', Georgia, serif;
    background: var(--bg);
    color: var(--text-dark);
    min-height: 100vh;
    overflow-x: hidden;
  }
 
  #page-home {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    min-height: 100vh;
    position: relative;
    overflow: hidden;
  }
 
  .pond-scene {
    width: 100%;
    height: 100vh;
    position: relative;
    overflow: hidden;
  }
 
  .scene-layer {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    transition: opacity 1.8s ease-in-out;
  }
 
  .scene-layer svg {
    width: 100%; height: 100%;
    position: absolute;
    top: 0; left: 0;
  }
 
  .sky-text {
    position: absolute;
    top: 12%; left: 50%;
    transform: translateX(-50%);
    text-align: center;
    pointer-events: none;
    z-index: 20;
  }
 
  .sky-text h1 {
    font-family: 'EB Garamond', Georgia, serif;
    font-size: 13px;
    font-weight: 400;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    transition: color 2s ease-in-out;
  }
 
  .duck-wrapper {
    position: absolute;
    top: 46%; left: 50%;
    transform: translateX(-50%);
    cursor: pointer;
    z-index: 10;
    animation: float 4s ease-in-out infinite;
  }
 
  .duck-wrapper:hover {
    animation-play-state: paused;
    transform: translateX(-50%) scale(1.08);
  }
 
  @keyframes float {
    0%, 100% { transform: translateX(-50%) translateY(0px) rotate(-0.3deg); }
    50% { transform: translateX(-50%) translateY(-1.5px) rotate(0.3deg); }
  }
 
  .duck-svg { width: 64px; height: 64px; filter: drop-shadow(0 4px 8px rgba(0,0,0,0.3)); }
 
  .click-ripple {
    position: fixed;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.5);
    width: 10px; height: 10px;
    margin: -5px;
    pointer-events: none;
    animation: clickRipple 0.8s ease-out forwards;
    z-index: 100;
  }
 
  @keyframes clickRipple { to { transform: scale(12); opacity: 0; } }
 
  #page-stories { display: none; min-height: 100vh; background: var(--paper); }
 
  .stories-header {
    padding: 48px 0 32px;
    text-align: center;
    border-bottom: 1px solid rgba(0,0,0,0.08);
    position: relative;
  }
 
  .stories-tagline {
    font-family: 'EB Garamond', Georgia, serif;
    font-size: 15px;
    font-style: italic;
    color: var(--text-light);
    margin-top: 10px;
    letter-spacing: 0.02em;
  }
 
  .stories-header h1 {
    font-family: 'EB Garamond', Georgia, serif;
    font-size: 13px;
    font-weight: 400;
    letter-spacing: 0.4em;
    color: var(--text-muted);
    text-transform: uppercase;
  }
 
  .back-btn {
    position: absolute;
    left: 40px; top: 50%;
    transform: translateY(-50%);
    background: none; border: none;
    font-family: 'EB Garamond', Georgia, serif;
    font-size: 13px;
    color: var(--text-light);
    cursor: pointer;
    letter-spacing: 0.1em;
    padding: 8px 0;
    transition: color 0.2s;
  }
 
  .back-btn:hover { color: #2a5f7a; }
 
  .catalog {
    max-width: 640px;
    margin: 0 auto;
    padding: 0 40px 80px;
  }
 
  .catalog-item {
    display: grid;
    grid-template-columns: 48px 1fr auto;
    align-items: baseline;
    gap: 0 20px;
    padding: 28px 0;
    border-bottom: 1px solid rgba(0,0,0,0.06);
    cursor: pointer;
    transition: opacity 0.2s;
  }
 
  .catalog-item:hover { opacity: 0.6; }
 
  .catalog-num {
    font-family: 'Courier Prime', 'Courier New', monospace;
    font-size: 12px;
    color: var(--text-light);
    letter-spacing: 0.05em;
    padding-top: 3px;
  }
 
  .catalog-title {
    font-family: 'EB Garamond', Georgia, serif;
    font-size: 22px;
    font-weight: 400;
    color: var(--text-dark);
    line-height: 1.3;
  }
 
  .catalog-date {
    font-family: 'Courier Prime', 'Courier New', monospace;
    font-size: 11px;
    color: var(--text-light);
    white-space: nowrap;
    letter-spacing: 0.05em;
  }
 
  #page-reader { display: none; min-height: 100vh; background: var(--paper); }
 
  .reader-header {
    padding: 48px 0 32px;
    text-align: center;
    border-bottom: 1px solid rgba(0,0,0,0.08);
    position: relative;
  }
 
  .reader-meta {
    font-family: 'Courier Prime', 'Courier New', monospace;
    font-size: 11px;
    color: var(--text-light);
    letter-spacing: 0.2em;
    text-transform: uppercase;
  }
 
  .reader-body {
    max-width: 580px;
    margin: 0 auto;
    padding: 64px 40px 120px;
  }
 
  .reader-num {
    font-family: 'Courier Prime', 'Courier New', monospace;
    font-size: 12px;
    color: var(--text-light);
    letter-spacing: 0.1em;
    margin-bottom: 20px;
  }
 
  .reader-title {
    font-family: 'EB Garamond', Georgia, serif;
    font-size: 36px;
    font-weight: 400;
    line-height: 1.2;
    margin-bottom: 16px;
    color: var(--text-dark);
  }
 
  .reader-note {
    font-family: 'EB Garamond', Georgia, serif;
    font-size: 17px;
    font-style: italic;
    color: var(--text-muted);
    line-height: 1.7;
    margin-bottom: 48px;
    padding-bottom: 32px;
    border-bottom: 1px solid rgba(0,0,0,0.08);
  }
 
  .reader-content {
    font-family: 'EB Garamond', Georgia, serif;
    font-size: 19px;
    line-height: 1.85;
    color: var(--text-dark);
  }
 
  .reader-content p { margin-bottom: 1.4em; }
  .reader-content em { font-style: italic; }
  .reader-content .poem-line { display: block; line-height: 1.6; }
  .reader-content .poem-stanza { margin-bottom: 1.4em; }
 
  .nav-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    max-width: 580px;
    margin: 0 auto;
    padding: 32px 40px 64px;
    border-top: 1px solid rgba(0,0,0,0.06);
  }
 
  .nav-btn {
    background: none; border: none;
    font-family: 'EB Garamond', Georgia, serif;
    font-size: 16px;
    color: var(--text-light);
    cursor: pointer;
    transition: color 0.2s;
    padding: 8px 0;
  }
 
  .nav-btn:hover { color: #2a5f7a; }
  .nav-btn:disabled { opacity: 0.2; cursor: default; }
 
  .nav-count {
    font-family: 'Courier Prime', 'Courier New', monospace;
    font-size: 11px;
    color: var(--text-light);
    letter-spacing: 0.1em;
  }
 
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .page-enter { animation: fadeIn 0.4s ease-out forwards; }
</style>
</head>
<body>
 
<div id="page-home">
  <div class="pond-scene">
    <div class="sky-text"><h1 id="pond-title">The Pond</h1></div>
    <div class="scene-layer" id="layer-a"></div>
    <div class="scene-layer" id="layer-b" style="opacity:0;"></div>
    <div class="duck-wrapper" id="duck" onclick="enterPond(event)" title="Enter">
      <svg class="duck-svg" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
        <ellipse cx="32" cy="42" rx="20" ry="14" fill="#f5c842"/>
        <ellipse cx="34" cy="44" rx="14" ry="9" fill="#d4a820" opacity="0.4"/>
        <circle cx="44" cy="30" r="11" fill="#f5c842"/>
        <ellipse cx="54.5" cy="31" rx="5" ry="3" fill="#e8890a"/>
        <circle cx="47" cy="27" r="2.5" fill="#1a1a18"/>
        <circle cx="47.8" cy="26.3" r="0.8" fill="white"/>
        <ellipse cx="36" cy="35" rx="9" ry="7" fill="#f5c842"/>
      </svg>
    </div>
  </div>
</div>
 
<div id="page-stories">
  <div class="stories-header">
    <button class="back-btn" onclick="showHome()">← pond</button>
    <h1>The Pond</h1>
    <p class="stories-tagline">Everything here is made up. Some of it happened.</p>
  </div>
  <div class="catalog" id="catalog-list"></div>
</div>
 
<div id="page-reader">
  <div class="reader-header">
    <button class="back-btn" onclick="showStories()">← all pieces</button>
    <div class="reader-meta" id="reader-meta"></div>
  </div>
  <div class="reader-body">
    <div class="reader-num" id="reader-num"></div>
    <h1 class="reader-title" id="reader-title"></h1>
    <div class="reader-note" id="reader-note"></div>
    <div class="reader-content" id="reader-content"></div>
  </div>
  <div class="nav-row">
    <button class="nav-btn" id="btn-prev" onclick="navigate(-1)">← prev</button>
    <span class="nav-count" id="nav-count"></span>
    <button class="nav-btn" id="btn-next" onclick="navigate(1)">next →</button>
  </div>
</div>
 
<script>
function makeScene(cfg) {
  const stars = cfg.hasStars ? `
    <circle cx="120" cy="40" r="1.2" fill="white" opacity="0.8"/>
    <circle cx="250" cy="20" r="0.9" fill="white" opacity="0.7"/>

  const waterStops = cfg.waterStops.map(s => `<stop offset="${s.offset}" stop-color="${s.color}"/>`).join('');
  const sunDefs = cfg.hasSun ? `<radialGradient id="sgg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="${cfg.sunColor}" stop-opacity="1"/>
      <stop offset="40%" stop-color="${cfg.sunGlowColor}" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="${cfg.sunGlowColor}" stop-opacity="0"/>

  const sun = cfg.hasSun ? `<ellipse cx="600" cy="${cfg.sunY}" rx="160" ry="70" fill="url(#sgg)" opacity="0.75"/>
    <circle cx="600" cy="${cfg.sunY}" r="22" fill="${cfg.sunColor}" opacity="0.9"/>` : '';

  <path d="M0,290 Q80,220 160,240 Q220,255 280,225 Q340,195 400,215 Q460,235 520,205 Q580,175 640,200 Q700,225 760,210 Q820,195 880,218 Q940,240 1000,220 Q1060,200 1120,225 Q1160,238 1200,230 L1200,312 L0,312 Z" fill="${cfg.mtnFar}"/>
  <path d="M0,300 Q60,250 130,265 Q190,278 250,252 Q310,226 370,248 Q430,268 490,245 Q550,222 610,242 Q670,262 730,248 Q790,234 850,252 Q910,270 970,255 Q1030,240 1090,258 Q1140,270 1200,260 L1200,312 L0,312 Z" fill="${cfg.mtnNear}"/>
  <path d="M0,380 Q80,290 200,310 Q320,328 400,312 L400,600 L0,600 Z" fill="${cfg.hillLeftColor}"/>
  <path d="M800,312 Q900,295 1020,308 Q1120,318 1200,300 L1200,600 L800,600 Z" fill="${cfg.hillRightColor}"/>
  <path d="M0,312 Q120,295 300,308 Q400,315 480,312 L480,340 Q400,345 300,338 Q120,325 0,340 Z" fill="${cfg.bankLeft}" opacity="0.95"/>
  <path d="M720,312 Q820,308 960,300 Q1080,294 1200,305 L1200,338 Q1080,325 960,330 Q820,338 720,340 Z" fill="${cfg.bankRight}" opacity="0.95"/>
  <rect x="58" y="248" width="5" height="62" fill="${cfg.treeFill}"/>
  <ellipse cx="60" cy="240" rx="18" ry="26" fill="${cfg.treeFill}"/>
  <rect x="98" y="256" width="4" height="54" fill="${cfg.treeFill}"/>
  <ellipse cx="100" cy="248" rx="14" ry="20" fill="${cfg.treeFill}"/>
  <rect x="145" y="230" width="5" height="80" fill="${cfg.treeFill}"/>
  <ellipse cx="147" cy="222" rx="16" ry="24" fill="${cfg.treeFill}"/>
  <rect x="185" y="258" width="4" height="52" fill="${cfg.treeFill}"/>
  <ellipse cx="187" cy="250" rx="13" ry="18" fill="${cfg.treeFill}"/>
  <rect x="1008" y="252" width="5" height="56" fill="${cfg.treeFill}"/>
  <ellipse cx="1010" cy="244" rx="17" ry="24" fill="${cfg.treeFill}"/>
  <rect x="1048" y="244" width="4" height="64" fill="${cfg.treeFill}"/>
  <ellipse cx="1050" cy="236" rx="15" ry="22" fill="${cfg.treeFill}"/>
  <rect x="1085" y="256" width="5" height="52" fill="${cfg.treeFill}"/>
  <ellipse cx="1087" cy="248" rx="14" ry="20" fill="${cfg.treeFill}"/>
  <rect x="1125" y="248" width="4" height="58" fill="${cfg.treeFill}"/>
  <ellipse cx="1127" cy="240" rx="16" ry="23" fill="${cfg.treeFill}"/>
  <rect x="0" y="312" width="1200" height="288" fill="url(#wg)"/>
  <line x1="300" y1="350" x2="500" y2="350" stroke="${cfg.waterShimmerColor}" stroke-width="1"/>
  <line x1="450" y1="375" x2="750" y2="375" stroke="${cfg.waterShimmerColor}" stroke-width="1"/>
  <line x1="620" y1="360" x2="900" y2="360" stroke="${cfg.waterShimmerColor}" stroke-width="1"/>
  <ellipse cx="600" cy="320" rx="14" ry="4" fill="${cfg.duckReflect}" opacity="0.55"/>
  <rect x="592" y="318" width="16" height="28" fill="${cfg.duckReflect}" opacity="0.18" rx="8"/>
  <line x1="0" y1="312" x2="1200" y2="312" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>
  ${mist}
  </svg>`;
}
 
const SCENES = {
  night: makeScene({
    skyStops: [{offset:'0%',color:'#060814'},{offset:'40%',color:'#0d1428'},{offset:'75%',color:'#141e38'},{offset:'100%',color:'#1a2440'}],
    waterStops: [{offset:'0%',color:'#0d1828'},{offset:'100%',color:'#080e18'}],
    hillLeftColor:'#0e1218', hillRightColor:'#0c1016', bankLeft:'#121a10', bankRight:'#101610',
    treeFill:'#080c08', mtnFar:'rgba(20,28,50,0.45)', mtnNear:'rgba(14,20,40,0.35)', hasMoon:true, hasStars:true, hasSun:false,
    waterShimmerColor:'rgba(200,220,255,0.08)', duckReflect:'#c8b840', mistOpacity:0, titleColor:'rgba(200,220,255,0.7)'
  }),
  dawn: makeScene({
    skyStops: [{offset:'0%',color:'#1a1030'},{offset:'25%',color:'#3a1a40'},{offset:'50%',color:'#c0607a'},{offset:'70%',color:'#e8a090'},{offset:'85%',color:'#f0c8a0'},{offset:'100%',color:'#c8a880'}],
    waterStops: [{offset:'0%',color:'#4a3858'},{offset:'50%',color:'#3a2848'},{offset:'100%',color:'#2a1c38'}],
    hillLeftColor:'#2a1e28', hillRightColor:'#221c20', bankLeft:'#2e2820', bankRight:'#2a2420',
    treeFill:'#160e14', mtnFar:'rgba(90,55,85,0.32)', mtnNear:'rgba(65,42,72,0.28)', hasMoon:false, hasStars:true, hasSun:true,
    sunColor:'#f0c0a0', sunGlowColor:'#e88070', sunY:320,
    waterShimmerColor:'rgba(240,180,160,0.15)', duckReflect:'#c8b840', mistOpacity:0.07, titleColor:'rgba(255,220,200,0.8)'
  }),
  day: makeScene({
    skyStops: [{offset:'0%',color:'#2878c8'},{offset:'40%',color:'#4898e0'},{offset:'75%',color:'#78b8f0'},{offset:'100%',color:'#a8d0f0'}],
    waterStops: [{offset:'0%',color:'#2a6a8a'},{offset:'50%',color:'#1e5070'},{offset:'100%',color:'#143858'}],
    hillLeftColor:'#3a5228', hillRightColor:'#304820', bankLeft:'#4a6a30', bankRight:'#405e28',
    treeFill:'#1e3410', mtnFar:'rgba(130,165,200,0.28)', mtnNear:'rgba(105,145,182,0.2)', hasMoon:false, hasStars:false, hasSun:true,
    sunColor:'#fff8c0', sunGlowColor:'#f0e080', sunY:180,
    waterShimmerColor:'rgba(255,255,255,0.18)', duckReflect:'#c8b020', mistOpacity:0, titleColor:'rgba(18,50,80,0.6)'
  }),
  sunset: makeScene({
    skyStops: [{offset:'0%',color:'#1a1230'},{offset:'18%',color:'#4a2040'},{offset:'38%',color:'#8b3a2a'},{offset:'55%',color:'#c96a2a'},{offset:'65%',color:'#e8943a'},{offset:'74%',color:'#f2b85a'},{offset:'82%',color:'#d4c870'},{offset:'100%',color:'#8aaa80'}],
    waterStops: [{offset:'0%',color:'#3a4050'},{offset:'50%',color:'#2a3040'},{offset:'100%',color:'#12202a'}],
    hillLeftColor:'#3a2a1a', hillRightColor:'#2a3020', bankLeft:'#3a4a2a', bankRight:'#2e3d22',
    treeFill:'#1a1a0a', mtnFar:'rgba(85,52,42,0.38)', mtnNear:'rgba(62,42,32,0.3)', hasMoon:false, hasStars:false, hasSun:true,
    sunColor:'#f2d060', sunGlowColor:'#e8943a', sunY:312,
    waterShimmerColor:'rgba(242,184,90,0.15)', duckReflect:'#d4a820', mistOpacity:0, titleColor:'rgba(255,220,160,0.7)'
  })
};
 
const titleColors = { night:'rgba(200,220,255,0.7)', dawn:'rgba(255,220,200,0.8)', day:'rgba(18,50,80,0.6)', sunset:'rgba(255,220,160,0.7)' };
 
function getSceneBlend(hour, minute) {
  const t = hour + minute / 60;
  const phases = [{name:'night',start:0},{name:'dawn',start:5},{name:'day',start:10},{name:'sunset',start:18},{name:'night',start:23}];
  const trans = 1.0;
  for (let i = 0; i < phases.length - 1; i++) {
    const a = phases[i], b = phases[i+1];
    if (t >= a.start && t < b.start) {
      const segLen = b.start - a.start;
      const elapsed = t - a.start;
      if (elapsed > segLen - trans) {
        const blend = (elapsed - (segLen - trans)) / trans;
        return { sceneA: a.name, sceneB: b.name, blend: Math.min(blend, 1) };
      }
      return { sceneA: a.name, sceneB: a.name, blend: 0 };
    }
  }
  return { sceneA: 'night', sceneB: 'night', blend: 0 };
}
 
function interpolateColor(c1, c2, t) {
  const parse = h => {
    h = h.replace(/^rgba?\(/,'').replace(/\)$/,'');
    if (h.startsWith('#')) { const n=parseInt(h.slice(1),16); return [n>>16&255,n>>8&255,n&255,1]; }
    const p=h.split(',').map(Number); return [p[0],p[1],p[2],p[3]??1];
  };
  const [r1,g1,b1,a1]=parse(c1), [r2,g2,b2,a2]=parse(c2);
  return `rgba(${Math.round(r1+(r2-r1)*t)},${Math.round(g1+(g2-g1)*t)},${Math.round(b1+(b2-b1)*t)},${+(a1+(a2-a1)*t).toFixed(2)})`;
}
 
function applyScene() {
  const now = new Date();
  const { sceneA, sceneB, blend } = getSceneBlend(now.getHours(), now.getMinutes());
  const layerA = document.getElementById('layer-a');
  const layerB = document.getElementById('layer-b');
  layerA.innerHTML = SCENES[sceneA];
  layerA.style.opacity = '1';
  if (blend === 0) {
    layerB.style.opacity = '0';
  } else {
    layerB.innerHTML = SCENES[sceneB];
    layerB.style.opacity = String(blend);
  }
  const titleColor = blend === 0 ? titleColors[sceneA] : interpolateColor(titleColors[sceneA], titleColors[sceneB], blend);
  document.getElementById('pond-title').style.color = titleColor;
}
 
applyScene();
setInterval(applyScene, 60000);
 
const stories = [
  {
    num: "001",
    title: "The Lemon to My Aid",
    date: "2026",
    type: "poem",
    note: "",
    content: `<div class="poem-stanza">
      <span class="poem-line">You're the flower to my stem, the bees to my knees.</span>
      <span class="poem-line">The puzzle to my piece, the lemon to my squeeze.</span>
      <span class="poem-line">And when life is bitter, you are my sweet.</span>
      <span class="poem-line">The lemon to my aid.</span>
    </div>`
  },
 
 
 
 
 
  {
    num: "002",
    title: "A Prison With an Open Door",
    date: "2026",

    content: `<p>There I was. Old enough to bear arms, yet too young to bear the weight of them. Orleans, mud to my boots, watching France bleed into the earth. The English had us cornered like dogs and I had made my peace with God, or tried to. I reckoned death was coming for me and I meant to meet it standing.</p>
    <p>Then I heard her.</p>
    <p>A girl on horseback, screaming toward the fortress like the wrath of Heaven itself had taken flesh. The hooves of her horse were swallowed by her war cries. It was not the grace of cherubim that came to mind, it was the fury of Saint Michael, sword drawn, cast from above. I had not believed the legend when it reached my ears. A maiden leading men of France? I thought it madness. I thought it heresy, even.</p>
    <p>But I followed. God help me, I followed.</p>
    <p>When she charged into the lion's den bearing nothing but her standard, something broke loose in my chest that I have no word for. The arrow found her between neck and shoulder. She did not fall. She did not weep. She pressed forward and so did every man around her, myself among them. We took the fortress. We won because she made us willing to die for something greater than ourselves.</p>
    <p>Two years hence, Rouen. She was nineteen when they put the torch to her. I was twenty-two and still fool enough to believe the righteous were protected. It was as I imagined Calvary, not equal to it, God forgive me for the comparison, but of the same terrible spirit. The flames were slow. She clutched a cross fashioned from sticks and cried out the name of Jesus until her voice was taken from her. The crowd held its breath. The fire did not. I watched her mouth move in prayer long after sound had left her, and I felt something depart from me that day that I cannot name, faith, perhaps, or simply the belief that goodness is rewarded in this world.</p>
    <p>But five and twenty years is a long road. Long enough to learn that peace is not the province of men. Long enough for the Church to confess its sin, to name her martyr, to call the trial a corruption, to declare her innocent before God and man. I was seven and forty when I gave my testimony. My hands trembled as I spoke of that April morning. The judge asked whether I believed. I told him plainly: I believe in her. And I believe in God enough to trust what I cannot see and leave the rest to Him. Whether that is faith or mere stubbornness, I cannot say with certainty. But it is all I have carried these long years. And it has not failed me yet.</p>`

let currentStoryIndex = 0;
 
function buildCatalog() {
  const list = document.getElementById('catalog-list');
  list.innerHTML = stories.map((s, i) => `
    <div class="catalog-item" onclick="showReader(${i})">
      <span class="catalog-num">${s.num}</span>
      <span class="catalog-title">${s.title}</span>
      <span class="catalog-date">${s.date}</span>
    </div>
  `).join('');
}
 
function enterPond(e) {
  const ripple = document.createElement('div');
  ripple.className = 'click-ripple';
  ripple.style.left = e.clientX + 'px';
  ripple.style.top = e.clientY + 'px';
  document.body.appendChild(ripple);
  setTimeout(() => ripple.remove(), 800);
  setTimeout(() => {
    document.getElementById('page-home').style.display = 'none';
    const p = document.getElementById('page-stories');
    p.style.display = 'block';
    p.classList.add('page-enter');
    buildCatalog();
  }, 200);
}
 
function showHome() {
  document.getElementById('page-stories').style.display = 'none';
  document.getElementById('page-reader').style.display = 'none';
  document.getElementById('page-home').style.display = 'flex';
}
 
function showStories() {
  document.getElementById('page-reader').style.display = 'none';
  const p = document.getElementById('page-stories');
  p.style.display = 'block';
  p.classList.add('page-enter');
}
 
function showReader(i) {
  currentStoryIndex = i;
  const s = stories[i];
  document.getElementById('reader-meta').textContent = s.type + ' · ' + s.date;
  document.getElementById('reader-num').textContent = s.num;
  document.getElementById('reader-title').textContent = s.title;
  const noteEl = document.getElementById('reader-note');
  noteEl.style.display = s.note ? 'block' : 'none';
  if (s.note) noteEl.textContent = s.note;
  document.getElementById('reader-content').innerHTML = s.content;
  document.getElementById('nav-count').textContent = (i + 1) + ' / ' + stories.length;
  document.getElementById('btn-prev').disabled = i === 0;
  document.getElementById('btn-next').disabled = i === stories.length - 1;
  document.getElementById('page-stories').style.display = 'none';
  const p = document.getElementById('page-reader');
  p.style.display = 'block';
  p.classList.add('page-enter');
  window.scrollTo(0, 0);
}
 
function navigate(dir) {
  const next = currentStoryIndex + dir;
  if (next >= 0 && next < stories.length) showReader(next);
}
